<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OMEGA</title><style>body{margin:0;background:#071017;color:#dce8ee;font:14px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.card{background:#0b151c;border:1px solid #21343d;border-radius:12px;padding:14px}.muted{color:#91a7b0}button{min-height:44px;padding:9px 13px;border:1px solid #304952;background:#0b151c;color:#dce8ee;border-radius:9px;cursor:pointer}button:disabled{opacity:.35;cursor:not-allowed}.research{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.bar{height:8px;background:#13232a;border-radius:9px;overflow:hidden}.fill{height:100%;background:#668f9c}.tiny{font-size:12px}.mono{font:12px ui-monospace,monospace;line-height:1.6}</style></head>
<body><main id="app"></main><script src="game.js"></script></body></html>
